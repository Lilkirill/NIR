! Arista EOS sample configuration
hostname leaf-eos-1
service password-encryption
username admin privilege 15 secret sha512 $6$example
!
management ssh
   idle-timeout 30
!
interface Ethernet1
   description uplink-to-spine
   no shutdown
   ip address 10.10.0.2/31
!
interface Ethernet2
   description server-link
   no shutdown
   ip address 10.10.10.1/24
!
ip route 0.0.0.0/0 10.10.0.3
!
