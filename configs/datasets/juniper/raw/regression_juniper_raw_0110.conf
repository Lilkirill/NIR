system {
    host-name jnpr-r0300;
    login {
        user admin {
            class super-user;
            authentication {
                encrypted-password "$6$regression";
            }
        }
    }
}
interfaces {
    ge-0/0/0 {
        description "WAN uplink prepared case 300";
        unit 0 {
            family inet {
                address 10.1.45.1/30;
            }
        }
    }
    ge-0/0/1 {
        description "LAN prepared case 300";
        unit 0 {
            family inet {
                address 172.17.50.1/24;
            }
        }
    }
}
routing-options {
    static {
        route 0.0.0.0/0 next-hop 10.1.45.2;
    }
}
