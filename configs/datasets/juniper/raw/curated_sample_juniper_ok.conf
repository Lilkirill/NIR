system {
    host-name dc-edge-1;
    services {
        ssh;
    }
    login {
        user admin {
            class super-user;
            authentication {
                encrypted-password "$6$hash";
            }
        }
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 172.16.0.1/30;
            }
        }
    }
}
routing-options {
    static {
        route 0.0.0.0/0 next-hop 172.16.0.2;
    }
}
