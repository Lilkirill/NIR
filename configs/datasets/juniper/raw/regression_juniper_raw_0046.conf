system {
    host-name jnpr-r0236;
    services {
        ssh;
    }
    login {
        user netops {
            class super-user;
            authentication {
                encrypted-password "$6$regression";
            }
        }
    }
}
interfaces {
    ge-0/0/0 {
        description "WAN uplink prepared case 236";
        unit 0 {
            family inet {
                address 10.0.236.1/30;
            }
        }
    }
    ge-0/0/1 {
        description "LAN prepared case 236";
        unit 0 {
            family inet {
                address 172.17.236.1/24;
            }
        }
    }
}
routing-options {
    static {
        route 0.0.0.0/0 next-hop 10.0.236.2;
    }
}
